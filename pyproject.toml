[project]
name = "whatsthesource"
version = "0.1.0"
description = "Application that helps us summaries research paper in meaningful manner"
authors = [
    {name = "Asif Sayyed",email = "asifdotexe@gmail.com"}
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "streamlit (>=1.51.0,<2.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "pypdf (>=6.4.0,<7.0.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "google-genai (>=1.52.0,<2.0.0)"
]

[dependency-groups]
dev = [
    "pytest (>=9.0.1,<10.0.0)",
    "pandas (>=2.3.3,<3.0.0)",
    "pylint (>=4.0.3,<5.0.0)",
    "black (>=25.11.0,<26.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "pre-commit (>=4.5.0,<5.0.0)"
]

[project.urls]
Homepage = "https://github.com/Asifdotexe/WhatsTheSource"
Issues = "https://github.com/Asifdotexe/WhatsTheSource/issues"

[tool.poetry]
packages = [{include = "wts", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
